name: Release

# Release automation, driven by conventional commits.
#
# On every push to main, release-please opens or updates a Release PR that
# bumps the version in package.json and writes CHANGELOG.md. Merging that PR is
# the release decision: release-please then tags the commit, creates the GitHub
# release, and the publish job below pushes the package to npm.
#
# The publish step lives in THIS file on purpose. npm trusted publishing is
# pinned to a repository AND a workflow filename, so renaming this file, or
# moving the publish into a workflow of its own, breaks publishing until the
# trusted publisher on npmjs.com is updated to match.
#
# It also has to share a workflow with release-please rather than being
# triggered by the tag it creates: a tag pushed using the default GITHUB_TOKEN
# does not start another workflow run, which GitHub does deliberately so that
# workflows cannot trigger themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest

    outputs:
      released: ${{ steps.release.outputs.releases_created }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # `id-token: write` is what lets GitHub mint the OIDC token npm verifies.
      # Provenance is attached automatically on an OIDC publish.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
      #
      # Deliberately no `registry-url` here. That input makes setup-node write
      # an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`, and npm then
      # authenticates with that value instead of falling back to OIDC. With no
      # NPM_TOKEN secret it sends the literal placeholder and the publish fails
      # with a confusing 404.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Node 22 still bundles npm 10, which predates OIDC publishing.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm -v

      - name: Install
        run: pnpm install --frozen-lockfile

      # Published with npm rather than pnpm: pnpm's OIDC support has known
      # regressions (pnpm/pnpm#11513). npm still honours the `files` field and
      # runs `prepublishOnly` (typecheck, lint, tests, build) before packing.
      - name: Publish
        run: npm publish --access public --provenance
