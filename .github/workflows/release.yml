name: Release

# Publishes to npm when a v* tag is pushed:
#   pnpm version patch && git push --follow-tags
#
# Authentication is via npm trusted publishing (OIDC) — there is no NPM_TOKEN.
# The matching trusted publisher must be registered on npmjs.com against this
# repository AND this workflow filename (release.yml); renaming this file will
# break publishing until the trusted publisher is updated to match.
#
# `id-token: write` is what lets GitHub mint the OIDC token npm verifies.
# Provenance is attached automatically on an OIDC publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
      #
      # Deliberately no `registry-url` here. That input makes setup-node write
      # an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`, and npm then
      # authenticates with that value instead of falling back to OIDC. With no
      # NPM_TOKEN secret it sends the literal placeholder and the publish fails
      # with a confusing 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node 22 still bundles npm 10, which predates OIDC publishing.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm -v

      - name: Install
        run: pnpm install --frozen-lockfile

      # Published with npm rather than pnpm: pnpm's OIDC support has known
      # regressions (pnpm/pnpm#11513). npm still honours the `files` field and
      # runs `prepublishOnly` (typecheck, lint, tests, build) before packing.
      # Confirms GitHub actually exposed an OIDC token to this step.
      - name: Diagnose OIDC availability
        run: |
          echo "npm: $(npm -v)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC request URL: present"
          else
            echo "OIDC request URL: MISSING (id-token permission not applied)"
          fi
          echo "--- npmrc files ---"
          echo "userconfig=${NPM_CONFIG_USERCONFIG:-<unset>}"
          cat .npmrc 2>/dev/null || echo "no repo .npmrc"
          cat ~/.npmrc 2>/dev/null || echo "no home .npmrc"

      - name: Publish
        run: npm publish --access public --provenance --loglevel verbose
