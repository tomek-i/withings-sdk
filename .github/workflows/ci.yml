name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The commit type drives the version release-please picks, so a wrong type
  # silently produces a wrong release. Enforced here rather than trusted.
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the history between base and head to lint the range.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # Catches the class of packaging bug where the tarball ships no build
      # output, or main/types point at files that do not exist.
      - name: Verify the published package resolves
        run: |
          pnpm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/withings-sdk-*.tgz
          node --input-type=module -e "
            import { WithingsClient } from 'withings-sdk';
            if (typeof WithingsClient !== 'function') throw new Error('ESM entry point is broken');
            console.log('ESM entry point OK');
          "
          node --input-type=commonjs -e "
            const { WithingsClient } = require('withings-sdk');
            if (typeof WithingsClient !== 'function') throw new Error('CJS entry point is broken');
            console.log('CJS entry point OK');
          "
          test -f node_modules/withings-sdk/dist/index.d.ts || { echo 'missing type declarations'; exit 1; }
